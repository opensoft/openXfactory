# Same project and historical baseline; only the analysis executor changes.
sonar.projectKey=opensoft_openxFactory
sonar.organization=opensoft
sonar.sources=.
sonar.tests=.
# Actual executable test/support trees, also covered by the inventory guard.
sonar.test.inclusions=tests/**,experiments/avatar-brokered-call/tests/**,experiments/avatar-brokered-call/conftest.py,specs/040-private-connectivity/tests/**,specs/043-private-connectivity-production/tests/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=.coverage-reports/coverage.xml
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
